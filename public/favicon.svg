<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Maroon Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A1C40" />
      <stop offset="100%" stop-color="#4A0A1E" />
    </linearGradient>
    
    <!-- Ultra-Bright Gold Gradient for the 'L' -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="50%" stop-color="#F2D06B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    
    <!-- Subtle drop shadow to make the L stand out more -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Smooth Rounded Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg)" />

  <!-- The Bright Letter 'L' -->
  <text 
    x="256" 
    y="380" 
    font-family="'Playfair Display', 'Didot', 'Georgia', 'Times New Roman', serif" 
    font-size="360" 
    font-weight="700" 
    fill="url(#gold)" 
    text-anchor="middle" 
    filter="url(#shadow)"
  >
    L
  </text>
</svg>
